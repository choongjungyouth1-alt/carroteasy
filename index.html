*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--ink);font:16px/1.5 P,system-ui,-apple-system,sans-serif;letter-spacing:-.2px;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 18px 8px}
header img{width:40px;height:40px;object-fit:contain}
header small{display:block;font-size:11px;font-weight:600;color:var(--sub)}
header b{font-size:21px;font-weight:850;line-height:1.2}
.chip{margin-left:auto;font-size:11px;font-weight:700;background:#fff;border-radius:99px;padding:6px 10px;white-space:nowrap}
.pager{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.pager.lock{overflow-x:hidden}
.panel{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:6px 18px 24px;overscroll-behavior-y:contain}
nav{display:flex;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(74,58,46,.06);padding:6px 0 max(8px,env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:6px 0;cursor:pointer;color:#B9AA9A;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--org)}
nav.lock{pointer-events:none;opacity:.5}
.card{background:#fff;border-radius:22px;padding:16px}
.mt{margin-top:12px}
h2{font-size:19px;font-weight:850;margin:0}
.sub{font-size:12px;color:var(--sub)}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.weeks{display:flex;gap:5px;margin-top:6px}
.weeks div{flex:1;text-align:center;font-size:11px;font-weight:700;padding:7px 0;border-radius:10px;background:rgba(255,255,255,.45);color:var(--sub)}
.weeks .past{background:#fff;color:var(--ink)}
.weeks .now{background:var(--org);color:#fff}
.seg{display:flex;background:rgba(255,255,255,.55);border-radius:14px;padding:4px;margin-top:12px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 0;font-weight:800;font-size:14px;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(74,58,46,.08)}
.podium{display:flex;gap:8px;align-items:flex-end;margin-top:14px}
.pd{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;border:0;background:none;padding:0}
.pd img{object-fit:contain;display:block}
.pd .nm{font-weight:850;margin-top:6px}
.pd .tp{font-weight:800;color:var(--org)}
.pd .blk{width:100%;border-radius:16px 16px 0 0;display:flex;justify-content:center;padding-top:8px;font-weight:900;background:#fff}
.pd.first .blk{background:var(--org);color:#fff}
.tag{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--org);border-radius:99px;padding:2px 7px;margin-bottom:3px}
.note{background:var(--hill);border-radius:0 0 16px 16px;padding:10px 14px;font-size:12px;color:var(--sub);line-height:1.5}
.note b{color:var(--ink)}
.banner{display:flex;align-items:center;gap:10px;background:var(--org);color:#fff;border-radius:16px;padding:12px 14px;margin-top:12px;font-size:12.5px;line-height:1.45}
.banner b{font-size:13.5px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:9px 14px 9px 10px;border:0;width:100%;text-align:left;cursor:pointer}
.li .rk{width:24px;text-align:center;font-weight:850;font-size:16px;line-height:1.1}
.li .mv{display:block;font-size:9.5px;font-weight:800}
.up{color:var(--org)}.dn{color:var(--blue)}
.li img{width:44px;height:44px;object-fit:contain}
.li .bd{flex:1}
.bar{height:7px;border-radius:4px;background:var(--tube);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--org2)}
.mine{box-shadow:inset 0 0 0 2px var(--org2)}
.teaser{display:flex;align-items:center;gap:12px;border:0;width:100%;text-align:left;cursor:pointer;margin-top:12px}
.teaser img{width:48px;height:48px;object-fit:contain}
.go{margin-left:auto;font-weight:800;color:var(--org);font-size:13px;white-space:nowrap}
.rrow{display:flex;align-items:center;gap:10px;padding:7px 0}
.rrow .n{width:52px;font-size:13px;font-weight:700}
.rrow .v{width:36px;text-align:right;font-size:12px;font-weight:800}
.medal{width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.empty{background:var(--hill);border-radius:16px;padding:16px;text-align:center;font-size:13px;font-weight:700;line-height:1.6;margin-top:12px}
/* cell */
.viewing{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:700}
.viewing button{border:0;background:var(--hill);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:800;color:var(--org);cursor:pointer}
.hero{position:relative;height:290px;border-radius:24px;overflow:hidden;background:linear-gradient(#DDEEFD,#EEF6FF)}
.hero .hill{position:absolute;left:-10%;right:-10%;bottom:-50px;height:110px;border-radius:50% 50% 0 0;background:#fff}
.tube{position:absolute;left:58%;top:30px;width:30px;height:180px;border-radius:15px 15px 0 0;background:var(--tube);overflow:hidden}
.tube i{position:absolute;left:0;right:0;bottom:0;background:var(--org);transition:height .8s ease-out}
.bulb{position:absolute;left:calc(58% - 18px);top:202px;width:66px;height:66px;border-radius:50%;background:var(--org);color:#fff;font-weight:900;font-size:21px;display:flex;align-items:center;justify-content:center}
.hero .av{position:absolute;left:6%;top:96px;width:130px;height:130px;object-fit:contain}
.tick{position:absolute;left:calc(58% + 38px);font-size:11px;font-weight:700;color:var(--sub)}
.big{font-size:36px;font-weight:900;color:var(--org);line-height:1.1}
.pill{display:inline-block;font-size:11px;font-weight:700;background:var(--hill);border-radius:99px;padding:5px 10px}
.wbars{display:flex;margin-top:10px}
.wb{flex:1;text-align:center}
.wb .col{height:72px;display:flex;align-items:flex-end;justify-content:center}
.wb .col i{width:24px;border-radius:7px 7px 3px 3px;background:var(--org2)}
.wb .col i.now{background:var(--org)}
.wb .col i.fut{height:72px;border:2px dashed var(--line);background:none}
.wb small{font-size:10px;color:var(--sub)}
.wb b{font-size:10px;color:var(--org);display:block;min-height:15px}
.mis{padding:12px 0;border-top:1px solid var(--line)}
.mis .row img{width:26px;height:26px;object-fit:contain}
.chips{margin-top:8px}
.chips span{display:inline-block;font-size:12px;font-weight:600;background:#EAF0FD;border-radius:99px;padding:5px 10px;margin:0 5px 6px 0}
.items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.item{border:0;background:var(--hill);border-radius:16px;padding:6px 0 5px;text-align:center;cursor:pointer;font-size:10.5px;font-weight:700}
.item img{width:52px;height:52px;object-fit:contain;display:block;margin:0 auto}
.item.sel{box-shadow:inset 0 0 0 2px var(--org);background:#fff}
.item.lock{cursor:default;color:var(--sub)}
.item.lock img{filter:grayscale(1) opacity(.35)}
.q{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.q img{width:46px;height:46px;object-fit:contain;background:var(--hill);border-radius:14px;padding:3px}
.q.lk img{filter:grayscale(1) opacity(.45)}
.q .t{font-size:13.5px;font-weight:800;line-height:1.35}
.q .ok{font-size:11px;font-weight:800;color:#fff;background:var(--org);border-radius:99px;padding:4px 9px;white-space:nowrap}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.pick button{border:0;background:#fff;border-radius:16px;padding:14px 0;font-weight:800;cursor:pointer}
/* game */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 0;font-weight:850;font-size:17px;background:var(--org);color:#fff;margin-top:12px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);margin-top:8px}
.btn:focus-visible,.li:focus-visible,nav button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:var(--hill);border-radius:14px;padding:9px 0;text-align:center}
.stat small{display:block;font-size:11px;color:var(--sub);font-weight:600}
.stat b{font-size:21px;font-weight:900}
.prev{display:flex;justify-content:center;gap:4px}
.hole{position:relative;aspect-ratio:1/1;cursor:pointer}
.hole .snow{position:absolute;left:4%;right:4%;bottom:6%;height:38%;border-radius:50%;background:#fff;box-shadow:0 4px 0 #DCE9F7}
.hole .pit{position:absolute;left:18%;right:18%;bottom:15%;height:19%;border-radius:50%;background:#B9AA9A}
.hole .mask{position:absolute;left:0;right:0;top:-12%;bottom:24%;overflow:hidden;pointer-events:none}
.hole .it{position:absolute;left:8%;width:84%;aspect-ratio:1/1;bottom:-90%;transition:bottom .14s ease-out}
.hole.up .it{bottom:-6%}
.hole .it.rab{left:2%;width:96%;bottom:-100%}
.hole.up .it.rab{bottom:-12%}
.hole .it img,.hole .it svg{width:100%;height:100%;display:block;object-fit:contain;object-position:center bottom}
.hole.hit .it{bottom:60%;opacity:0;transition:bottom .25s ease-out,opacity .25s .1s}
.hole.bonk .it.rab{transform:translateY(-6%);transition:transform .12s}
.fx{position:absolute;left:50%;top:0;transform:translate(-50%,0);font-weight:900;font-size:17px;color:var(--org);pointer-events:none;animation:fly .6s ease-out forwards;white-space:nowrap}
.fx.bad{color:var(--blue)}
@keyframes fly{to{transform:translate(-50%,-34px);opacity:0}}
.hud{display:flex;gap:10px}
.hud .stat{background:#fff;border-radius:18px;padding:10px 14px;text-align:left}
.hud .stat b{font-size:34px;line-height:1.1}
.tbar{margin-top:12px;height:12px;border-radius:6px;background:#fff;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--org);transform-origin:left}
.field{margin-top:12px;background:linear-gradient(#DDEEFD,#F2F8FF);border-radius:28px;padding:22px 10px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px}
.count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:96px;font-weight:900;color:#fff;background:rgba(74,58,46,.25);z-index:9}
.count.on{display:flex}
.res{text-align:center;padding-top:6px}
.badge{display:inline-block;font-size:14px;font-weight:800;color:#fff;background:var(--org);border-radius:99px;padding:6px 14px}
.res .face{width:140px;height:140px;margin:10px auto 0}
.res .face svg{width:100%;height:100%;display:block}
.huge{font-size:64px;font-weight:900;color:var(--org);line-height:1.05}
.huge span{font-size:24px}
.rows{background:#fff;border-radius:22px;padding:2px 18px;margin-top:14px}
.rows div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.rows div:last-child{border:0}
.rows span{color:var(--sub)}
.reg input{width:100%;margin-top:10px;border:0;background:var(--hill);border-radius:14px;padding:13px 14px;font:600 16px P,system-ui;color:var(--ink);outline:none}
.reg input:focus{box-shadow:0 0 0 2px var(--org)}
.hit{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:11px 6px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;text-align:left;cursor:pointer}
.hit span{font-size:12.5px;font-weight:600;color:var(--sub)}
.hit.sel{background:#FFF1E7;border-radius:10px}
.hall .r{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.hall .r i{font-style:normal;width:22px;text-align:center;font-weight:850}
.hall .r b{margin-left:auto;color:var(--org)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:700;border-radius:99px;padding:10px 16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;white-space:nowrap}
.toast.on{opacity:1}
.demo{font-size:11px;color:var(--sub);text-align:center;margin-top:14px}
.adm{position:fixed;inset:0;z-index:20;background:#F4F1EC;display:none;flex-direction:column}
.adm.on{display:flex}
.adm .top{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px 10px;background:var(--ink);color:#fff}
.adm .top b{font-size:18px;flex:1}
.adm .top button{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:99px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
.atabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;scrollbar-width:none;flex:none}
.atabs::-webkit-scrollbar{display:none}
.atabs button{flex:none;border:0;background:#F4F1EC;border-radius:99px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;color:var(--sub)}
.atabs button.on{background:var(--ink);color:#fff}
.abody{flex:1;overflow-y:auto;padding:14px 16px 40px;max-width:640px;width:100%;margin:0 auto}
.abody .card{border-radius:18px}
.abody h3{margin:0 0 4px;font-size:16px;font-weight:850}
.chipsel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chipsel button{border:0;background:#fff;border-radius:12px;padding:8px 11px;font-weight:700;font-size:13px;cursor:pointer}
.chipsel button.on{background:var(--org);color:#fff}
.mrow{display:flex;align-items:center;gap:6px;padding:9px 0;border-top:1px solid var(--line)}
.mrow .nm{flex:1;font-weight:700;font-size:14.5px}
.tg{border:0;border-radius:10px;padding:8px 0;width:52px;font-size:12px;font-weight:800;background:#F4F1EC;color:#B9AA9A;cursor:pointer}
.tg.on{background:var(--org);color:#fff}
.num{display:flex;gap:10px;margin-top:10px}
.num label{flex:1;font-size:12px;font-weight:700;color:var(--sub)}
.num input,.fld input,.fld select{width:100%;border:0;background:#F4F1EC;border-radius:12px;padding:11px 12px;font:700 16px P,system-ui;color:var(--ink);margin-top:4px}
.fld{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.fld label{font-size:12px;font-weight:700;color:var(--sub)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.tbl th{font-size:11.5px;color:var(--sub);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.warn{background:#FFF1E7;border-radius:14px;padding:11px 13px;font-size:12.5px;line-height:1.55;color:#9A4E22;margin-top:10px}
.mini{display:inline-flex;gap:2px;align-items:flex-end;height:22px;vertical-align:middle}
.mini i{width:7px;background:var(--org2);border-radius:2px}
.btn.dark{background:var(--ink)}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px;margin:0}
.copy{width:100%;min-height:150px;border:0;background:#F4F1EC;border-radius:12px;padding:12px;font:500 13px/1.6 P,system-ui;color:var(--ink);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}
</style>

/* ===== API ===== */
async function api(action, params) {
  if (DEMO) return demoApi(action, params || {});
  const q = new URLSearchParams(Object.assign({action}, params || {}));
  const r = await fetch(CONFIG.API + '?' + q.toString());
  return r.json();
}
async function post(body) {
  if (DEMO) return demoPost(body);
  const r = await fetch(CONFIG.API, {method:'POST', body: JSON.stringify(body)});
  return r.json();
}

function demoBuild() {
  const base = [['하람셀',82.4,67.0],['세윤셀',78.5,64.8],['승현셀',74.1,62.0],['승찬셀',72.6,62.8],['진셀',71.0,59.6],['은비셀',69.8,61.9],['준현셀',66.9,56.7],['민철셀',64.2,55.6],['지우셀',61.5,54.6],['인영셀',60.7,49.9],['현빈셀',58.3,52.6],['새가족셀',55.0,47.9]];
  const hats = ['santa','earmuff','halo','scarf','beanie','base','earmuff','scarf','base','beanie','base','halo'];
  const cells = base.map(([name,temp,prev],i) => {
    const pick = n => DEMO_NAMES.slice(i%5, i%5+n);
    const done = {earmuff: i<6, scarf: i%3===0||i===1, santa: i===0, halo: i===2||i===11, beanie:false, antler:false};
    const qs = [['earmuff','기도의 골방에 4명 이상',4],['scarf','태신자 작정 카드 5장 모으기',5],['santa','금요성회에 3명 이상',3],['halo','주일예배·셀모임에 7명 이상',7],['beanie','버닝 주간에 세 미션 모두 달성',1],['antler','태신자 1명 이상 초청',1]]
      .map(([id,label,goal]) => ({id,label,goal,cur: done[id]?goal:Math.max(0,goal-1-(i%2)),done: done[id], opensAt: id==='beanie'?4:undefined}));
    const hat = done[hats[i]] || hats[i]==='base' ? hats[i] : 'base';
    return {name,temp,prev,delta:+(temp-prev).toFixed(1),weeks:[+(prev-11).toFixed(1),prev,temp],heat:Math.round(temp*0.45*10)/10,pledge:3+(i%4),invite:0,
      members:{golbang:pick(4-(i%2)),friday:pick(2+(i%2)),sunday:pick(7-(i%3))},quests:qs,hat:i===1?'earmuff':hat};
  });
  const ORD=['준현셀','세윤셀','진셀','민철셀','하람셀','지우셀','은비셀','승현셀','현빈셀','인영셀','승찬셀','새가족셀'];cells.sort((a,b)=>ORD.indexOf(a.name)-ORD.indexOf(b.name));
  return {week:3,burnWeek:4,updated:'12/6 21:00',cells,game:demoGame()};
}

function demoGame(){
  const h = store.get('dg_demo_hall', DEMO_HALL);
  const top = Object.entries(h).map(([k,v])=>({name:k.split('|')[0],cell:k.split('|')[1],score:v})).sort((a,b)=>b.score-a.score);
  const by = {}; top.forEach(x=>(by[x.cell]=by[x.cell]||[]).push(x.score));
  const cells = Object.keys(by).map(c=>{const t=by[c].slice(0,3);return{cell:c,avg:Math.round(t.reduce((a,b)=>a+b,0)/t.length*10)/10,n:by[c].length}}).sort((a,b)=>b.avg-a.avg);
  return {top:top.slice(0,10),cells,players:top.length};
}
const DEMO_ROSTER = [['이승찬','승찬셀'],['이세윤','세윤셀'],['김하람','하람셀'],['김하은','세윤셀'],['박서준','하람셀'],['최유진','세윤셀'],['정민재','승현셀'],['한서연','진셀'],['오지훈','하람셀'],['윤다인','세윤셀'],['송현우','민철셀'],['임지아','지우셀'],['강도윤','은비셀'],['조하린','인영셀'],['신우진','현빈셀'],['배수아','새가족셀']];
function demoApi(a,p){
  if(a==='data') return Promise.resolve(demoBuild());
  if(a==='search'){const q=(p.q||'').replace(/\s/g,'');return Promise.resolve(q.length<2?[]:DEMO_ROSTER.filter(r=>r[0].includes(q)).slice(0,10))}
  if(a==='my'){const k=p.name+'|'+p.cell,h=store.get('dg_demo_hall',DEMO_HALL),t=store.get('dg_demo_today',{});const d=new Date().toDateString();const n=(t.d===d&&t[k])||0;return Promise.resolve({best:h[k]||0,today:n,left:Math.max(0,3-n)})}
}
function demoPost(b){
  if(b.action==='score'){const k=b.name+'|'+b.cell,h=store.get('dg_demo_hall',DEMO_HALL),t=store.get('dg_demo_today',{});const d=new Date().toDateString();if(t.d!==d){for(const x in t)delete t[x];t.d=d}
    if((t[k]||0)>=3)return Promise.resolve({ok:false,reason:'limit',left:0});t[k]=(t[k]||0)+1;store.set('dg_demo_today',t);
    if(!h[k]||h[k]<b.score)h[k]=b.score;store.set('dg_demo_hall',h);const best=h[k];const all=Object.values(h);
    return Promise.resolve({ok:true,best,rank:all.filter(v=>v>best).length+1,players:all.length,left:3-t[k]})}
  if(b.action==='hat'){return Promise.resolve({ok:true})}
}

/* ===== 공통 ===== */
/* 온도는 포스터 칸 스티커 단위(36.5 + 2n, 32번 = 100°)로 보여 줘요 */
const kanOf = t => t >= 100 ? 32 : Math.max(0, Math.min(31, Math.floor((t - 36.5) / 2 + 1e-9)));
const snap = t => t >= 100 ? 100 : 36.5 + 2 * kanOf(t);
function normalize(){D.cells.forEach(c=>{if(c.raw!=null)return;c.raw=c.temp;c.kan=kanOf(c.temp);c.toNext=c.kan>=32?0:Math.round((Math.min(100,36.5+2*(c.kan+1))-c.temp)*10)/10;
  c.temp=snap(c.raw);c.prev=snap(c.prev);c.weeks=(c.weeks||[]).map(snap);c.delta=Math.round((c.temp-c.prev)*10)/10;c.dk=c.kan-kanOf(c.prev)})}
const cellOf = n => D.cells.find(c => c.name === n);
function ranked(key){return D.cells.map((c,i)=>[c,i]).sort((a,b)=>b[0][key]-a[0][key]||a[1]-b[1]).map(x=>x[0])}
/* 같은 온도면 같은 순위 (1, 1, 3 …) */
function rankMap(){const now={},prev={};D.cells.forEach(c=>{now[c.name]=1+D.cells.filter(x=>x.temp>c.temp).length;prev[c.name]=1+D.cells.filter(x=>x.prev>c.prev).length});return{now,prev}}
const avatar = c => AV[c.hat] || AV.base;

/* ===== 1. 순위 ===== */
function weekBar(){
  return '<div class="weeks">'+[1,2,3,4,5].map(i=>`<div class="${i===D.week?'now':i<D.week?'past':''}">${i===5?'고백데이':i+'주'+(i===D.burnWeek?' 🔥':'')}</div>`).join('')+'</div>';
}
function phaseBanner(){
  const w=D.week,b=D.burnWeek;
  if(w===b-1) return `<div class="banner"><span style="font-size:20px">🔥</span><div><b>다음 주는 버닝 주간!</b><br>${BURN_RANGE} 참여는 온도가 두 배로 올라요</div></div>`;
  if(w===b) return `<div class="banner"><span style="font-size:20px">🔥</span><div><b>버닝 주간 진행 중</b><br>이번 주 참여는 온도가 두 배로 올라요</div></div>`;
  if(w===5) return `<div class="banner"><span style="font-size:20px">🎉</span><div><b>고백데이! 모든 셀이 100°C에 도착했어요</b><br>함께 끓어오른 5주, 수고했어요</div></div>`;
  return '';
}

      <div class="blk" style="height:${rk===1?112:rk===2?80:60}px;font-size:${big?32:24}px">${rk}</div></button>`}).join('')+'</div>';
    h+=`<div class="note"><b>모든 셀이 100°C를 향해요.</b> 몇 명이 왔는지보다, 우리 셀이 얼마나 함께했는지가 온도를 올려요.</div>`;

    h+='<div class="list">'+L.slice(3).map((c,i)=>{const n=R.now[c.name],mv=R.prev[c.name]-n;const pct=Math.max(0,Math.min(100,(c.temp-36.5)/63.5*100));
      return `<button class="li ${c.name===myCell?'mine':''}" data-cell="${esc(c.name)}"><div class="rk">${n}<span class="mv ${mv>0?'up':'dn'}">${mv>0?'▲'+mv:mv<0?'▼'+(-mv):''}</span></div><img src="${avatar(c)}" alt="">

  }
  if(DEMO) h+='<p class="demo">예시 데이터로 보이는 화면이에요</p>';
  el.innerHTML=h;
  el.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{viewCell=b.dataset.cell;renderCell();go(1)});
  const t=$('teaser');if(t)t.onclick=()=>go(2);
}

/* --- 게임 진행 --- */
const DUR=30000;let st=null,raf=0,spawnT=0,holes=[];
function begin(practice){
  const el=$('p2');el.scrollTop=0;
  el.innerHTML=`<div class="hud mt"><div class="stat"><small>뽑은 당근</small><b id="score" style="color:var(--org)">0</b></div><div class="stat"><small>콤보</small><b id="combo">×0</b></div></div>
   <div class="tbar"><i id="tb"></i></div><div class="sub" id="tl" style="text-align:right;font-weight:700;margin-top:4px">30초</div><div class="field" id="field"></div>${practice?'<div class="sub" style="text-align:center;margin-top:10px">연습 모드 · 오늘 기회를 다 써서 기록은 남지 않아요</div>':''}`;
  holes=[];const f=$('field');
  for(let i=0;i<9;i++){const h=document.createElement('div');h.className='hole';h.innerHTML='<div class="snow"></div><div class="pit"></div><div class="mask"></div>';f.appendChild(h);holes.push({el:h,mask:h.querySelector('.mask'),type:null,timer:0});h.addEventListener('pointerdown',e=>{e.preventDefault();tap(i)})}
  st={score:0,combo:0,maxc:0,car:0,hat:0,rab:0,t0:0,run:false,practice};
  $('pager').classList.add('lock');$('nav').classList.add('lock');
  const c=$('count');let n=3;c.textContent=n;c.classList.add('on');
  const iv=setInterval(()=>{n--;if(n>0)c.textContent=n;else{clearInterval(iv);c.classList.remove('on');st.run=true;st.t0=performance.now();spawnT=0;raf=requestAnimationFrame(loop)}},700);
}
function loop(now){
  if(!st||!st.run)return;
  const left=Math.max(0,DUR-(now-st.t0));$('tb').style.transform=`scaleX(${left/DUR})`;$('tl').textContent=Math.ceil(left/1000)+'초';
  const fast=left<10000;
  if(now>=spawnT){spawn(fast);spawnT=now+(fast?340:520)*(0.85+Math.random()*0.3)}
  if(left<=0)return end();
  raf=requestAnimationFrame(loop);
}
function spawn(fast){
  if(holes.filter(h=>h.type).length>=(fast?4:3))return;
  const free=holes.map((h,i)=>i).filter(i=>!holes[i].type);if(!free.length)return;
  const i=free[Math.floor(Math.random()*free.length)],h=holes[i],r=Math.random();
  h.type=r<.15?'rab':r<.26?'hat':'car';
  h.mask.innerHTML=h.type==='rab'?`<div class="it rab">${RAB_S}</div>`:`<div class="it"><img src="${h.type==='hat'?AV.santa:CARROTS[Math.floor(Math.random()*CARROTS.length)]}" alt=""></div>`;
  h.el.className='hole';void h.el.offsetWidth;h.el.classList.add('up');

function hide(i){const h=holes[i];if(!h.type)return;if(h.type!=='rab'&&st&&st.run){st.combo=0;$('combo').textContent='×0'}h.el.classList.remove('up');h.type=null;setTimeout(()=>{if(!holes[i].type)holes[i].mask.innerHTML=''},160)}
function fx(i,t,bad){const f=document.createElement('div');f.className='fx'+(bad?' bad':'');f.textContent=t;holes[i].el.appendChild(f);setTimeout(()=>f.remove(),620)}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function tap(i){
  const h=holes[i];if(!st||!st.run||!h.type)return;clearTimeout(h.timer);
  if(h.type==='rab'){st.score=Math.max(0,st.score-2);st.combo=0;st.rab++;h.mask.querySelector('.it').innerHTML=RAB_W;h.el.classList.add('bonk');fx(i,'깼다! −2',true);buzz(60)}
  else{const add=h.type==='hat'?3:1;st.combo++;st.maxc=Math.max(st.maxc,st.combo);const bonus=st.combo%10===0?2:0;st.score+=add+bonus;h.type==='hat'?st.hat++:st.car++;h.el.classList.add('hit');fx(i,(add===3?'+3':'쏙! +1')+(bonus?' 🔥+2':''));buzz(15)}
  $('score').textContent=st.score;$('combo').textContent='×'+st.combo;h.type=null;
  setTimeout(()=>{if(!holes[i].type){holes[i].el.className='hole';holes[i].mask.innerHTML=''}},260);
}

function calcTemps(R,bases){
  const out={},fw=R.fw||5;
  A.cells.map(c=>c.name).forEach(n=>{let cum=0;out[n]={};for(let w=1;w<=5;w++){const a=aggOf(w,n);const b=bases[n]||1;const burn=w===R.bw?R.bm:1;
    const inc=(Math.min(a.g/b,1)*R.g+Math.min(a.f/b,1)*R.f)*burn+Math.min(a.s/b,1)*R.m;cum=w>=fw?32:Math.min(32,cum+inc);out[n][w]=cum>=32?100:Math.round((36.5+2*cum)*10)/10}});
  return out;
}
function admRules(){
  const R0=A.rules,W=Math.max(1,R0.week);
  const R=aState.r||(aState.r={g:R0.g,f:R0.f,m:R0.m,bw:R0.bw,bm:R0.bm});
  const B=aState.b||(aState.b=Object.fromEntries(A.cells.map(c=>[c.name,c.base])));
  const F=[['g','기도의 골방 최대 칸'],['f','금요성회 최대 칸'],['m','주일예배·셀모임 최대 칸'],['bw','버닝 주차'],['bm','버닝 배수 (골방·금요성회만)']];
  const now=calcTemps(R0,Object.fromEntries(A.cells.map(c=>[c.name,c.base]))),nw=calcTemps(Object.assign({},R0,R),B);
  const changed=JSON.stringify(R)!==JSON.stringify({g:R0.g,f:R0.f,m:R0.m,bw:R0.bw,bm:R0.bm})||A.cells.some(c=>+B[c.name]!==c.base);
  $('abody').innerHTML=`<div class="card"><h3>온도 규칙</h3><div class="sub" style="line-height:1.6">미션마다 받는 칸 = 최대 칸 × (참여 인원 ÷ 평소 인원, 최대 100%). 1칸 = 2°C. 버닝 주차엔 골방·금요성회만 × 버닝 배수. 5주차 고백데이엔 모든 셀이 32칸(100°C)이 돼요.</div>
   <div class="fld">${F.map(([k,l])=>`<label>${l}<input type="number" step="1" inputmode="numeric" data-k="${k}" value="${R[k]}"></label>`).join('')}</div></div>
   <div class="card mt"><h3>셀별 평소 인원 (보정 기준)</h3><div class="sub">참여율의 분모예요. 공개되지 않아요.</div><div class="fld">${A.cells.map(c=>`<label>${esc(c.name)}<input type="number" step="0.1" inputmode="decimal" data-b="${esc(c.name)}" value="${B[c.name]}"></label>`).join('')}</div></div>
   <div class="card mt"><div class="row sp"><h3>미리보기 · ${W}주차 온도</h3><span class="sub">저장 전</span></div><table class="tbl"><thead><tr><th>셀</th><th>지금</th><th>바꾸면</th><th>차이(°C)</th></tr></thead><tbody>
   ${A.cells.map(c=>{const a=snap(now[c.name][W]),b=snap(nw[c.name][W]),d=Math.round((b-a)*10)/10;return `<tr><td>${esc(c.name)}</td><td>${a}°</td><td><b>${b}°</b></td><td class="${d<0?'dn':d>0?'up':''}">${d>0?'+':''}${d}</td></tr>`}).join('')}</tbody></table>
   ${W>=1&&changed?'<div class="warn">이미 공개된 주차의 온도도 다시 계산돼요. 온도가 내려가는 셀이 있으면 사이트에서 순위가 갑자기 바뀌어 보일 수 있어요.</div>':''}
   <button class="btn dark" id="rsave" ${changed?'':'disabled style="opacity:.4"'}>규칙 저장</button><button class="btn ghost" id="rreset">처음 값으로</button></div>`;
  $('abody').querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>{R[i.dataset.k]=+i.value;admRules()});
  $('abody').querySelectorAll('[data-b]').forEach(i=>i.onchange=()=>{B[i.dataset.b]=+i.value;admRules()});
  $('rreset').onclick=()=>{aState.r=null;aState.b=null;admRules()};
  $('rsave').onclick=e=>{const b=e.target;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='한 번 더 누르면 저장';return}saveDo(b,'admin_save_rules',{rules:R,bases:B},'규칙을 저장했어요').then(()=>{aState.r=null;aState.b=null})};
}
function admRoster(){
  const L=A.roster.filter(r=>r.cell===ac);
  $('abody').innerHTML=`<div class="card"><h3>셀 고르기</h3>${cellChips(ac,'rc')}</div>
   <div class="card mt"><h3>새 셀원 추가 · ${esc(ac)}</h3><div class="fld"><label>이름 (실명)<input id="nn" maxlength="10" placeholder="홍길동"></label><label>또래<input id="na" maxlength="4" inputmode="numeric" placeholder="03"></label></div><button class="btn" id="nadd">${esc(ac)}에 추가</button>
   <div class="sub" style="margin-top:6px">추가하면 '활동'으로 등록되고, 참여 입력 체크리스트와 게임 이름 검색에 바로 나와요.</div></div>
   <div class="card mt"><h3>${esc(ac)} 명단 ${L.length}명</h3>${L.map((r,i)=>`<div class="mrow"><span class="nm">${esc(r.name)} <span class="sub">${esc(r.age)}</span></span><select data-i="${i}" style="border:0;background:#F4F1EC;border-radius:10px;padding:8px;font:700 13px P,system-ui;color:var(--ink)">${STATUSES.map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')}</div>`;
  bindChips('rc',c=>{ac=c;admRoster()});
  $('nadd').onclick=e=>{const n=$('nn').value.trim();if(n.length<2)return toast('이름을 두 글자 이상 넣어 주세요');saveDo(e.target,'admin_roster_add',{cell:ac,name:n,age:$('na').value.trim()},`${n} 추가했어요`)};
  $('abody').querySelectorAll('select[data-i]').forEach(s=>s.onchange=async()=>{const r=L[+s.dataset.i];const res=await apost('admin_roster_status',{cell:r.cell,name:r.name,status:s.value}).catch(()=>({ok:false}));if(res.ok){r.status=s.value;toast(`${r.name} → ${s.value}`);aload()}else{s.value=r.status;toast('바꾸지 못했어요')}});
}
function admGame(){
  $('abody').innerHTML=`<div class="card"><h3>최근 게임 기록</h3><div class="sub">이상한 기록만 지워 주세요. 지우면 되돌릴 수 없어요.</div>
   ${A.game.length?A.game.map((g,i)=>`<div class="mrow"><span class="nm">${esc(g.name)} <span class="sub">${esc(g.cell)} · ${esc(String(g.ts).slice(5,16))} · 콤보 ${g.combo}</span></span><b style="color:var(--org);width:44px;text-align:right">${g.score}</b><button class="btn sm ghost" data-i="${i}" style="background:#F4F1EC">삭제</button></div>`).join(''):'<div class="sub mt">아직 기록이 없어요</div>'}</div>`;
  $('abody').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const g=A.game[+b.dataset.i];if(!b.dataset.sure){b.dataset.sure=1;b.textContent='정말?';return}saveDo(b,'admin_game_del',{row:g.row,ts:g.ts,name:g.name},'기록을 지웠어요')});
}
/* 예시 모드용 관리자 데이터 */
let DA=null;
function demoAdmin(action,x){
  if(!DA){const R={g:2,f:2,m:3,bw:4,bm:2,fw:5,t0:36.5,kan:2,week:D.week};const cells=D.cells.map((c,i)=>({name:c.name,base:5+(i%4)}));
    const roster=[];cells.forEach((c,i)=>DEMO_NAMES.slice(i%6,i%6+8).forEach((n,k)=>roster.push({cell:c.name,name:n,age:String(1+k).padStart(2,'0'),status:k===7?'미출석(10~11월)':'활동'})));
    const part={},rec={};let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
    for(let w=1;w<=3;w++)cells.forEach(c=>{roster.filter(r=>r.cell===c.name&&r.status==='활동').forEach(r=>part[w+'|'+c.name+'|'+r.name]=[rnd()<.5,rnd()<.35,rnd()<.75]);rec[w+'|'+c.name]=[Math.floor(rnd()*3),0]});
    DA={ok:true,rules:R,cells,roster,part,rec,agg:[],game:D.game.top.map((g,i)=>({row:i+2,ts:'2026-12-0'+(i%6+1)+' 21:0'+i,cell:g.cell,name:g.name,score:g.score,combo:Math.floor(g.score/4)}))};}
  const recalc=()=>{DA.agg=[];const tmpA=A;A=DA;DA.agg=[];const cnt=(w,c,j)=>DA.roster.filter(r=>r.cell===c).reduce((a,r)=>a+((DA.part[w+'|'+c+'|'+r.name]||[])[j]?1:0),0);
    const raw=[];for(let w=1;w<=5;w++)DA.cells.forEach(c=>raw.push({w,cell:c.name,g:cnt(w,c.name,0),f:cnt(w,c.name,1),s:cnt(w,c.name,2)}));DA.agg=raw;
    const T=calcTemps(DA.rules,Object.fromEntries(DA.cells.map(c=>[c.name,c.base])));
    raw.forEach(a=>{const b=DA.cells.find(c=>c.name===a.cell).base;a.rate=(Math.min(a.g/b,1)*2+Math.min(a.f/b,1)*2+Math.min(a.s/b,1)*3)/7;a.temp=T[a.cell][a.w];a.kan=a.temp>=100?32:Math.floor((a.temp-36.5)/2+1e-9);const p=raw.find(x=>x.w===a.w-1&&x.cell===a.cell);a.kanWeek=a.kan-(p?p.kan:0)});A=tmpA};
  if(action==='admin_save_part'){x.rows.forEach(r=>DA.part[x.week+'|'+x.cell+'|'+r.name]=[r.g,r.f,r.s]);DA.rec[x.week+'|'+x.cell]=[x.pledge,x.invite]}
  if(action==='admin_publish')DA.rules.week=x.week;
  if(action==='admin_save_rules'){Object.assign(DA.rules,x.rules);DA.cells.forEach(c=>{if(x.bases[c.name])c.base=+x.bases[c.name]})}
  if(action==='admin_roster_add')DA.roster.push({cell:x.cell,name:x.name,age:x.age,status:'활동'});
  if(action==='admin_roster_status'){const r=DA.roster.find(r=>r.cell===x.cell&&r.name===x.name);if(r)r.status=x.status}
  if(action==='admin_game_del')DA.game=DA.game.filter(g=>g.row!==x.row);
  recalc();
  return Promise.resolve(JSON.parse(JSON.stringify(DA)));
}
